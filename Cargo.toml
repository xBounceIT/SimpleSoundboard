[package]
name = "simple-soundboard"
version = "1.0.1"
edition = "2024"
description = "A desktop soundboard that patches clips and voice into a virtual microphone."
license = "MIT"

[dependencies]
anyhow = "1"
cpal = "0.18.2"
# GPUI Kit pins and re-exports GPUI + GPUI Components (gpui-component).
gpui-kit = "0.9.0"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
symphonia = { version = "0.6.1", features = ["mp3"] }
ureq = "3.3"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
